{% extends "base.html" %}
{% load static %}
{% block title %}Create account - SkillNest{% endblock %}
{% block content %}
<main class="auth-card">
  <h1 id="form-title"></h1>
  <p id="role-note" class="role-note"></p>
  <div id="form-error" class="form-error" role="alert"></div>
  <form id="signup-form" novalidate>
    <input type="hidden" name="role" value="">
    <div class="field">
      <label for="full_name">Full name</label>
      <input id="full_name" name="full_name" type="text" autocomplete="name" maxlength="120"
             placeholder="Enter your full name" required>
    </div>
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email"
             placeholder="Enter your email address" required>
    </div>
    <div class="field">
      <label for="password">Password (10+ characters)</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" autocomplete="new-password"
               minlength="10" placeholder="Create your password" required>
        <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
    </div>
    <button class="btn btn-primary" id="submit-btn" type="submit"></button>
  </form>
  <p class="auth-alt">Already have an account? <a href="/login/">Log in</a></p>
</main>
{% endblock %}
{% block scripts %}
<script type="module" src="{% static 'js/pages/signup.js' %}"></script>
{% endblock %}
