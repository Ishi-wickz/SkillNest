{% extends "base.html" %}
{% load static %}
{% block title %}Choose a new password - SkillNest{% endblock %}
{% block content %}
<main class="auth-card">
  <h1>Choose a new password</h1>
  <div id="form-error" class="form-error" role="alert"></div>
  <p id="done" class="ok" role="status" hidden></p>
  <form id="reset-form" novalidate>
    <div class="field">
      <label for="password">New password (10+ characters)</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" autocomplete="new-password"
               minlength="10" required>
        <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
    </div>
    <div class="field">
      <label for="password2">Repeat the new password</label>
      <input id="password2" name="password2" type="password" autocomplete="new-password" required>
    </div>
    <button class="btn btn-primary" type="submit">Change password</button>
  </form>
  <p class="auth-alt"><a href="/forgot-password/">Request a new link</a> &middot; <a href="/login/">Log in</a></p>
</main>
{% endblock %}
{% block scripts %}
<script type="module" src="{% static 'js/pages/reset_password.js' %}"></script>
{% endblock %}
