{% extends "base.html" %}
{% load static %}
{% block title %}Log in - SkillNest{% endblock %}
{% block content %}
<main class="auth-card">
  <h1>Welcome back!</h1>
  <p class="role-note">Log in to access all your data</p>
  <div id="form-error" class="form-error" role="alert"></div>
  <form id="login-form" novalidate>
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email"
             placeholder="Enter your email address" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="Enter your password" required>
        <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
    </div>
    <p class="forgot"><a href="/forgot-password/">Forgot your password?</a></p>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="auth-alt">Don't have an account? <a href="/signup/">Register</a></p>
</main>
{% endblock %}
{% block scripts %}
<script type="module" src="{% static 'js/pages/login.js' %}"></script>
{% endblock %}
