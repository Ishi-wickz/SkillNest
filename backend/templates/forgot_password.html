{% extends "base.html" %}
{% load static %}
{% block title %}Forgot password - SkillNest{% endblock %}
{% block content %}
<main class="auth-card">
  <h1>Forgot your password?</h1>
  <p class="role-note">Enter your email and we'll send you a link to reset it.</p>
  <div id="form-error" class="form-error" role="alert"></div>
  <p id="done" class="ok" role="status" hidden></p>
  <form id="forgot-form" novalidate>
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email"
             placeholder="Enter your email address" required>
    </div>
    <button class="btn btn-primary" type="submit">Send reset link</button>
  </form>
  <p class="auth-alt"><a href="/login/">Back to log in</a></p>
</main>
{% endblock %}
{% block scripts %}
<script type="module" src="{% static 'js/pages/forgot_password.js' %}"></script>
{% endblock %}
