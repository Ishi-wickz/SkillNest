{% extends "base.html" %}
{% load static %}
{% block title %}Find Talent - SkillNest{% endblock %}
{% block content %}
<main class="page">
  <h1>Find talent</h1>
  <div class="jobs-layout">
    <aside>
      <form id="filters" class="filters" action="/talent/" method="get">
        <div class="field">
          <label for="q">Keyword</label>
          <input id="q" name="q" type="search" maxlength="100" placeholder="e.g. designer, Django">
        </div>
        <div class="field">
          <label for="skill">Skill</label>
          <select id="skill" name="skill"><option value="">Any skill</option></select>
        </div>
        <div class="field">
          <label>Hourly rate</label>
          <div class="row">
            <input name="min" type="number" min="0" step="1" placeholder="Min" aria-label="Minimum rate">
            <input name="max" type="number" min="0" step="1" placeholder="Max" aria-label="Maximum rate">
          </div>
        </div>
        <button class="btn-navy" type="submit">Apply filters</button>
        <a class="clear" href="/talent/">Clear</a>
      </form>
    </aside>
    <section>
      <p id="status" class="status" role="status"></p>
      <div id="talent-list"></div>
      <nav id="pager" class="pager" aria-label="Pagination"></nav>
    </section>
  </div>
</main>
{% endblock %}
{% block scripts %}
<script type="module" src="{% static 'js/pages/talent.js' %}"></script>
{% endblock %}
