{% extends "base.html" %}
{% load static %}
{% block title %}Job - SkillNest{% endblock %}
{% block content %}
<main class="page">
  <p><a href="/jobs/">&larr; Back to jobs</a></p>
  <p id="status" class="status" role="status">Loading…</p>
  <section id="job" class="panel" hidden></section>

  <p id="apply-note" class="note"></p>
  <section id="apply" class="panel" hidden>
    <h2>Submit a proposal</h2>
    <div id="form-error" class="form-error" role="alert"></div>
    <form id="proposal-form" novalidate>
      <div class="field">
        <label for="bid_amount">Your bid</label>
        <input id="bid_amount" name="bid_amount" type="number" min="1" step="0.01" required>
      </div>
      <div class="field">
        <label for="delivery_days">Delivery time (days)</label>
        <input id="delivery_days" name="delivery_days" type="number" min="1" max="365" step="1" required>
      </div>
      <div class="field">
        <label for="cover_letter">Cover letter (at least 20 characters)</label>
        <textarea id="cover_letter" name="cover_letter" minlength="20" maxlength="5000" required></textarea>
      </div>
      <button class="btn-navy" type="submit">Send proposal</button>
    </form>
  </section>
</main>
{% endblock %}
{% block scripts %}
<script type="module" src="{% static 'js/pages/job_detail.js' %}"></script>
{% endblock %}
